services:
  jenkins-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "8080:8080" # Web UI
      - "50000:50000" # Agent remoting port
    volumes:
      - jenkins-data:/var/jenkins_home
    networks:
      - jenkins-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/login" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  jenkins-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jenkins-agent
    restart: unless-stopped
    depends_on:
      jenkins-controller:
        condition: service_healthy
    environment:
      - JENKINS_URL=http://jenkins-controller:8080
      - JENKINS_AGENT_NAME=remote-agent-1
      - JENKINS_SECRET=${JENKINS_AGENT_SECRET:-}
      - JENKINS_AGENT_WORKDIR=/home/jenkins/agent
    volumes:
      - agent-data:/home/jenkins/agent
    networks:
      - jenkins-net

volumes:
  jenkins-data:
  agent-data:

networks:
  jenkins-net:
    driver: bridge
